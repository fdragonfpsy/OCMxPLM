<style>
:root{
  color-scheme:dark;
  --bg:#121A38; --input-bg:#121A38; --surf:#1A2550; --surf-h:#22305E; --border:#46527A; --card-border:rgba(175,187,214,.30);
  --text:#FFFFFF; --t2:#E9EEF5; --t3:#D7DEEA; --t4:#BAC5D9;
  --accent:#1DB8F2; --accent-h:#0FA6DE; --accent2:#00D5D0; --on-accent:#121A38;
  --accent-soft:rgba(29,184,242,.14); --accent-mid:rgba(29,184,242,.45);
  --ok:#2FBF8F; --warn:#F2B84B; --crit:#E5616B; --focus:#72D6FA;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --font:"Ubuntu","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r-card:8px; --r-ctl:6px;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#FFFFFF; --input-bg:#FFFFFF; --surf:#F2F6FA; --surf-h:#E1EEF9; --border:#BFC9D6; --card-border:#C9D2DE;
  --text:#121A38; --t2:#2F3A58; --t3:#4A5675; --t4:#5B6785;
  --accent:#0058AB; --accent-h:#004A91; --accent2:#00929B; --on-accent:#FFFFFF;
  --accent-soft:rgba(0,88,171,.08); --accent-mid:rgba(0,88,171,.35);
  --ok:#1B8F68; --warn:#A86300; --crit:#C23A45; --focus:#0058AB;
  --shadow:0 8px 24px rgba(18,26,56,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3,h4{font-weight:500;line-height:1.15}
h1{font-size:clamp(30px,4.2vw,46px)} h2{font-size:clamp(24px,3vw,32px)} h3{font-size:21px;line-height:1.25} h4{font-size:17px;line-height:1.3}
p{color:var(--t2)}
a{color:var(--accent)}
.small{font-size:14px}.cap{font-size:12px;color:var(--t3)}.muted{color:var(--t3)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:var(--r-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:12px}

/* header */
.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand img.logo-light{display:none}
:root[data-theme=light] .brand img.logo-dark{display:none}
:root[data-theme=light] .brand img.logo-light{display:block}
.brand span{color:var(--t3);font-weight:300;font-size:15px;border-left:1px solid var(--border);padding-left:16px;white-space:nowrap}
.toprt{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-ctl);overflow:hidden}
.lang button{height:34px;min-width:44px;padding:0 10px;background:none;border:0;cursor:pointer;font-size:13px;font-weight:500;color:var(--t3)}
.lang button+button{border-left:1px solid var(--border)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;background:none;border:1px solid var(--border);border-radius:var(--r-ctl);color:var(--t2);cursor:pointer}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbar-bg{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--border)}
.pbar{position:absolute;left:0;bottom:-1px;height:4px;background:var(--accent);transition:width .4s ease}

/* acts */
.acts{display:flex;gap:8px;max-width:820px;margin:0 auto 36px}
.acts div{flex:1}
.acts i{display:block;height:4px;border-radius:2px;background:var(--border);margin-bottom:8px}
.acts .on i{background:var(--accent)}.acts .cur i{background:var(--text)}
.acts span{font-size:13px;color:var(--t4)}
.acts .cur span{color:var(--text);font-weight:500}.acts .on span{color:var(--t2)}

/* demo banner */
.demo{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 16px;background:#F2B84B;color:#121A38;font-size:14px;font-weight:700}
.demo button{background:#121A38;color:#fff;border:0;border-radius:var(--r-ctl);padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer}

/* layout */
main{padding:44px clamp(16px,5vw,64px) 96px;min-width:0}
main:focus{outline:none}
.col{max-width:820px;margin:0 auto}
.wide{max-width:1120px;margin:0 auto}
.label{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:12px;display:block;letter-spacing:.01em}
.lead{font-size:18px;margin-top:16px;max-width:68ch}
.card{background:var(--surf);border:1px solid var(--card-border);border-radius:var(--r-card);padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.btn{height:48px;padding:0 24px;border-radius:var(--r-ctl);border:1px solid transparent;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .15s;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:var(--accent-h)}
.btn.sec{background:transparent;border-color:var(--t4);color:var(--text);font-weight:500}.btn.sec:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.pri:not([disabled]):active{transform:scale(.98)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:500;padding:6px 0;text-align:left}
.link:hover{text-decoration:underline}
.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:36px;flex-wrap:wrap}
.qh{margin-bottom:6px}
.qsub{color:var(--t3);font-size:15px;margin-bottom:20px}
.block+.block{margin-top:40px}

/* welcome */
.hook{display:flex;gap:16px;align-items:flex-start;border-left:3px solid var(--accent2);background:var(--surf);padding:16px 20px;border-radius:0 var(--r-card) var(--r-card) 0;margin:32px 0}
.hook b{font-weight:500;color:var(--text);display:block}
.hook .cap{margin-top:6px;display:block}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 28px}
.journey .card{padding:20px}
.journey .label{margin-bottom:6px}
.journey h4{margin-bottom:6px}
.journey p{font-size:14px}
.ticks{list-style:none;display:flex;flex-direction:column;gap:10px;margin:8px 0 32px}
.ticks li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--t2)}
.ticks svg{flex:none;color:var(--accent)}
.namebox{padding:24px;border:1px solid var(--accent-mid);background:var(--accent-soft);border-radius:var(--r-card)}
.namebox label{font-size:18px;font-weight:500;display:block;margin-bottom:12px}
.namerow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.namerow .inp{flex:1 1 260px}
.help{font-size:14px;color:var(--t3);margin-top:10px}

/* inputs */
.inp{height:48px;padding:0 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--r-ctl);width:100%}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.inp:hover{border-color:var(--t4)}.inp:focus{border-color:var(--accent)}
select.inp option{background:var(--input-bg);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--t2);font-weight:500}
.field .opt{color:var(--t3);font-weight:300}

/* type cards */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;display:flex;gap:16px;align-items:flex-start;text-align:left;padding:20px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-card);cursor:pointer;transition:border-color .15s,background .15s,transform .15s;min-height:104px}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard[aria-pressed=true]{border:2px solid var(--accent);background:var(--surf-h);padding:19px}
.tcard[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.tcard .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tcard[aria-pressed=true] .ic{background:var(--accent);color:var(--on-accent)}
.tcard .t{font-weight:500;color:var(--text);display:block}
.tcard .d{color:var(--t2);font-size:14px;display:block;margin-top:2px}
.tcard .chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t4);display:grid;place-items:center}
.tcard[aria-pressed=true] .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.counter{font-size:14px;color:var(--t3);margin:-8px 0 16px}

/* answer cards */
.answers{display:flex;flex-direction:column;gap:10px}
.answers.row{flex-direction:row;flex-wrap:wrap}
.answers.row .ans{flex:1 1 140px;min-height:60px}
.ans{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:60px;padding:14px 20px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-card);cursor:pointer;transition:border-color .15s,background .15s}
.ans:hover{border-color:var(--accent)}
.ans[aria-checked=true]{border:2px solid var(--accent);background:var(--surf-h);padding:13px 19px}
.ans .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--t4);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--t2)}
.ans[aria-checked=true] .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ans .t{font-weight:500;color:var(--text)}
.ans.cs{border-style:dashed;background:transparent}
.ans.cs .k{border-style:dashed}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative;margin:8px 0 4px}
.stepper:before{content:"";position:absolute;left:8%;right:8%;top:19px;height:2px;background:var(--border)}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0 6px;text-align:center;color:var(--t2);font-size:14px;line-height:1.3}
.stp .n{width:40px;height:40px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:grid;place-items:center;font-weight:700;color:var(--t3);transition:all .2s}
.stp:hover .n{border-color:var(--accent)}
.stp[aria-checked=true] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.12)}
.stp[aria-checked=true]{color:var(--text);font-weight:500}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:14px;color:var(--t2);transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}

/* tension cards */
.dots{display:flex;gap:6px;margin-bottom:20px}
.dots i{width:28px;height:4px;border-radius:2px;background:var(--border)}
.dots i.on{background:var(--accent)}.dots i.cur{background:var(--text)}
.tcard2{background:var(--surf);border:1px solid var(--card-border);border-radius:var(--r-card);padding:32px}
.tcard2.enter{animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.poles{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:28px 0 8px}
.pole{font-size:16px;color:var(--text);font-weight:500;line-height:1.35}
.pole.b{text-align:right}
.pole small{display:block;font-size:12px;color:var(--t3);font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.track{position:relative;display:flex;justify-content:space-between;align-items:center;height:64px;margin:4px 6px}
.rail{position:absolute;left:12px;right:12px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--border) 50%,var(--accent))}
.stop{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--t4);background:var(--surf);cursor:pointer;transition:all .2s ease;display:grid;place-items:center}
.stop:hover{border-color:var(--accent);transform:scale(1.15)}
.stop[aria-checked=true]{width:44px;height:44px;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 8px var(--accent-soft)}
.stop[aria-checked=true]:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--on-accent)}
.poslabel{text-align:center;font-size:14px;color:var(--t3);min-height:21px;margin-top:4px}
.poslabel.set{color:var(--accent);font-weight:500}
.csrow{display:flex;justify-content:center;margin-top:16px}
.csbtn{background:none;border:1.5px dashed var(--t4);border-radius:999px;padding:6px 16px;color:var(--t2);cursor:pointer;font-size:14px}
.csbtn[aria-pressed=true]{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:500}
.helper{color:var(--t3);font-size:15px;margin:-4px 0 20px}

/* summary card */
.summary{display:flex;gap:20px;align-items:flex-start;padding:28px;background:var(--surf);border:1px solid var(--card-border);border-left:4px solid var(--accent);border-radius:var(--r-card)}
.summary .big{font-size:20px;color:var(--text);line-height:1.4}
.ring{flex:none;width:64px;height:64px;position:relative}
.ring svg{width:100%;height:100%}
.ring .bg{fill:none;stroke:var(--border);stroke-width:5}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;animation:draw 0.9s .1s ease forwards;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .ck{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* reveal */
.reveal{text-align:center}
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:40px 0 32px;perspective:1200px}
.flip{height:220px;position:relative}
.flip .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-card);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.flip .back{background:repeating-linear-gradient(135deg,var(--surf) 0 12px,var(--surf-h) 12px 24px);border:1px solid var(--border)}
.flip .back b{font-size:44px;font-weight:300;color:var(--accent)}
.flip .front{background:var(--surf);border:2px solid var(--accent);transform:rotateY(180deg);justify-content:flex-start;padding-top:44px}
.flip .front .label{margin-bottom:10px}
.flip .front h3{font-size:19px}

/* results */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.disc{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--t3);margin-top:12px}
.sumline{font-size:19px;color:var(--text);margin:28px 0 8px;max-width:72ch;line-height:1.45}
.callout{border-left:3px solid var(--accent2);background:var(--surf);padding:14px 20px;border-radius:0 var(--r-card) var(--r-card) 0;margin:24px 0 0;font-size:15px;color:var(--t2)}
.hots{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.hot{background:var(--surf);border:1px solid var(--card-border);border-top:4px solid var(--accent);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:14px}
.hot .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;border:1.5px solid var(--border);color:var(--t2);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.fb{border-style:dashed}
.hot h3{font-size:20px}
.hot .sec b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:500;margin-bottom:4px}
.hot .sec p{font-size:15px}
.hot details summary{cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
.hot details summary::-webkit-details-marker{display:none}
.hot details summary:before{content:"+";display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--t4);border-radius:3px;font-size:12px}
.hot details[open] summary:before{content:"–"}
.hot details ul{margin:8px 0 0 18px;font-size:15px;color:var(--t2)}
.hot .ev{font-size:13px;color:var(--t3);border-top:1px solid var(--border);padding-top:12px}
.hot .ev span{display:block}
.hot .ask{background:var(--accent-soft);border-radius:var(--r-ctl);padding:14px 16px}
.kk{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--t3);margin-bottom:4px}
.hot .ask .kk{color:var(--accent)}
.hot .ask p{color:var(--text);font-weight:500;font-size:16px}
.hot .exp{font-size:14px;color:var(--t2)}
.hot .exp b{display:inline;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}
.sechead{margin:64px 0 8px}
.secsub{color:var(--t3);font-size:15px;margin-bottom:20px}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.pill{position:relative;text-align:left;padding:16px 14px 14px;border-radius:var(--r-card);border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:transform .15s,border-color .15s}
.pill:hover{transform:translateY(-2px);border-color:var(--accent)}
.pill .q{font-weight:500;font-size:15px;line-height:1.3;color:var(--text)}
.pill .nm{font-size:12px;color:var(--t3);margin-top:auto}
.pill .lv{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill.hi{background:var(--accent);border-color:var(--accent)}
.pill.hi .q,.pill.hi .lv,.pill.hi .nm{color:var(--on-accent)}
.pill.md{border-color:var(--accent);background:var(--accent-soft)}
.pill.md .lv{color:var(--accent)}
.pill.lo .lv{color:var(--t3)}
.pill.lo .q{color:var(--t2)}
.pill[aria-expanded=true]{box-shadow:0 0 0 3px var(--focus)}
.pills.anim .pill{animation:light .5s ease both}
@keyframes light{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pdetail{margin-top:14px;padding:18px 22px;border-radius:var(--r-card);background:var(--surf);border:1px solid var(--card-border)}
.pdetail h4{margin-bottom:6px}
.pdetail p+p{margin-top:8px}
.pdetail .line{color:var(--text);font-style:italic}
.also details{background:var(--surf);border:1px solid var(--card-border);border-radius:var(--r-card);margin-bottom:10px}
.also summary{cursor:pointer;padding:16px 20px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.also summary::-webkit-details-marker{display:none}
.also summary:after{content:"+";color:var(--accent);font-weight:700}
.also details[open] summary:after{content:"–"}
.also .body{padding:0 20px 18px}
.also .body p{font-size:15px}
.also .body p+p{margin-top:10px}
.qlist{margin:0 0 0 22px;display:flex;flex-direction:column;gap:10px}
.qlist li{color:var(--text);font-size:16px;padding-left:6px}
.qlist li::marker{color:var(--accent);font-weight:700}
.ulist{list-style:none;display:flex;flex-direction:column;gap:8px}
.ulist li{display:flex;gap:10px;color:var(--t2)}
.ulist li:before{content:"?";flex:none;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--warn);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cta{margin-top:64px;padding:36px;border-radius:var(--r-card);background:linear-gradient(120deg,var(--surf) 0%,var(--surf-h) 100%);border:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta h2{font-size:26px;margin-bottom:6px}
.banner{padding:12px 16px;border-radius:var(--r-ctl);border:1px solid var(--accent);background:var(--accent-soft);font-size:14px;margin-bottom:24px}

/* further */
.fcards{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;align-items:start}
.report{display:flex;gap:20px;align-items:flex-start}
.cover{flex:none;width:96px;height:128px;border-radius:4px;background:#fff;border:1px solid var(--border);padding:10px 9px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.cover i{display:block;height:4px;border-radius:2px;background:#D0D8E2}
.cover i.h{height:7px;background:#0058AB;width:70%}
.cover i.a{background:#1DB8F2;width:45%}
.cover i.s{width:80%}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.contact{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--border);margin-top:20px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent);display:grid;place-items:center;font-weight:700;color:var(--accent)}
.contact b{display:block;font-weight:500}
.contact span{display:block;font-size:14px;color:var(--t2)}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.codebox code{flex:1 1 260px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--input-bg);border:1px solid var(--border);word-break:break-all}
.priv{font-size:13px;color:var(--t3);margin-top:12px}

/* footer */
.foot{border-top:1px solid var(--border);padding:24px clamp(16px,5vw,64px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--t3)}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--t2);cursor:pointer;font-size:13px;padding:0}
.foot button:hover{color:var(--accent);text-decoration:underline}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.6);z-index:60;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--border);z-index:70;padding:24px 28px 40px;overflow:auto;box-shadow:var(--shadow);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer h2{font-size:24px}
.drawer section{padding:18px 0;border-top:1px solid var(--border)}
.drawer section h3{font-size:15px;font-weight:500;margin-bottom:10px;color:var(--t2)}
.drawer .btn{width:100%;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-ctl);overflow:hidden}
.seg button{height:38px;min-width:84px;padding:0 14px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--t2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);padding:28px;z-index:80;box-shadow:var(--shadow)}
.modal h2{font-size:22px;margin-bottom:10px}
.modal .about p+p{margin-top:12px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--surf-h);border:1px solid var(--accent);padding:12px 20px;border-radius:var(--r-ctl);font-size:14px;z-index:90}

#print{display:none}

@media (max-width:1000px){.hots{grid-template-columns:1fr}.pills{grid-template-columns:repeat(4,1fr)}.fcards{grid-template-columns:1fr}}
@media (max-width:760px){
  .top{padding:0 16px}.brand span{display:none}.brand img{height:24px}
  main{padding:28px 16px 80px}
  .grid2,.grid3,.journey,.tgrid,.twocol,.formgrid,.flips{grid-template-columns:1fr}
  .flip{height:150px}
  .stepper{grid-template-columns:1fr;gap:8px}.stepper:before{display:none}
  .stp{flex-direction:row;text-align:left;gap:14px}
  .pills{grid-template-columns:1fr 1fr}
  .poles{gap:16px}.pole{font-size:14px}
  .tcard2{padding:22px}
  .actions .btn{flex:1}
  .summary{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ring .fg,.ring .ck{stroke-dashoffset:0}}


/* ===== v1.1 ===== */
body{padding-bottom:56px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);padding:12px clamp(16px,5vw,64px);align-items:center}
.hook blockquote{font-size:17px;line-height:1.45;color:var(--text);font-weight:500}
.hook figcaption{margin-top:8px;display:block}
.disc{display:flex;margin-top:10px}
.sumline b{color:var(--text)}
.hots{display:grid;grid-template-columns:repeat(3,1fr);column-gap:20px;row-gap:0;margin-top:24px}
.hot{grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:14px;gap:14px}
.hot .see{font-size:15px;color:var(--t2)}
.hot .ask{align-self:stretch}
.hot .more{border-top:1px solid var(--border);padding-top:12px;align-self:start}
.morein{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.morein ul{margin:0 0 6px 18px;color:var(--t2);font-size:14px}
.morein .exp{font-size:14px;color:var(--t2)}
.morein .exp b{color:var(--text);font-weight:500}
.evl{font-size:13px;color:var(--t3)}
.teamq{margin-top:56px;padding:28px 32px;background:var(--surf);border:1px solid var(--card-border);border-radius:var(--r-card)}
.teamq h2{font-size:24px;margin-bottom:18px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.mini{padding:20px 24px;border:1px solid var(--card-border);border-radius:var(--r-card)}
.mini h3{font-size:17px;margin-bottom:10px}
.mini details{border-top:1px solid var(--border)}
.mini summary{cursor:pointer;padding:10px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.mini summary::-webkit-details-marker{display:none}
.mini summary:after{content:"+";color:var(--accent);font-weight:700}
.mini details[open] summary:after{content:"–"}
.mini .body{padding:0 0 12px}
.mini .body p{font-size:14px}
img.avatar{display:block;width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);background:var(--surf);flex:none}
img.avatar.lg{width:76px;height:76px}
.cta{justify-content:flex-start}
.cta .ctat{flex:1 1 280px}
.cta .ctat p{margin-top:4px}
.fstack{display:flex;flex-direction:column;gap:20px}
.fstack .card{padding:28px}
.fstack h2{font-size:24px}
.talkhead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.talkhead>div:first-child{flex:1 1 280px}
.talk .contact{border-top:0;margin-top:0;padding:0;flex:0 1 auto}
.link.dl{display:inline-flex;align-items:center;gap:8px;font-size:14px}
@media (max-width:1000px){.hots{grid-template-columns:1fr;row-gap:20px}.hot{grid-row:auto;display:flex;flex-direction:column}}
@media (max-width:760px){
  body{padding-bottom:48px}
  .foot{padding:10px 16px;justify-content:center}.foot .copy{display:none}.foot nav{gap:18px;justify-content:center;flex-wrap:nowrap;white-space:nowrap}.foot nav button:first-child{display:none}
  .minis{grid-template-columns:1fr}.teamq{padding:22px}
  .toast{bottom:60px}
}
/* print */
@media print{
  @page{size:A4;margin:16mm 14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#121A38;font-size:11pt}
  .skip,#toast{display:none!important}
  body.has-print #app{display:none!important}
  body.has-print #print{display:block}
}
.pr{font-family:var(--font);color:#121A38;line-height:1.45}
.pr .phd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0058AB;padding-bottom:8px;margin-bottom:18px}
.pr .phd img{height:22px}
.pr .phd span{font-size:9pt;color:#5A6685}
.pr .pdemo{background:#F2B84B;color:#121A38;font-weight:700;padding:6px 10px;margin-bottom:12px;font-size:10pt}
.pr h1{font-size:20pt;font-weight:500;margin:4px 0 6px;color:#121A38}
.pr h2{font-size:13pt;font-weight:500;color:#0058AB;margin:18px 0 8px}
.pr h3{font-size:12pt;font-weight:500;margin:0 0 6px;color:#121A38}
.pr p,.pr li{color:#3B4666;font-size:10pt}
.pr .meta{font-size:9.5pt;color:#5A6685}
.pr .ph{border:1px solid #D0D8E2;border-left:4px solid #0058AB;padding:10px 14px;margin-bottom:10px;break-inside:avoid}
.pr .ph .k{font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em;color:#5A6685;margin-top:6px;display:block}
.pr .ph .q{color:#121A38;font-weight:500}
.pr table{width:100%;border-collapse:collapse;font-size:9.5pt}
.pr th,.pr td{text-align:left;border-bottom:1px solid #D0D8E2;padding:5px 6px;vertical-align:top;color:#3B4666}
.pr th{color:#5A6685;font-weight:500}
.pr td.lv{font-weight:700;color:#0058AB;white-space:nowrap}
.pr ol,.pr ul{margin-left:18px}
.pr .src li{font-size:8.5pt;word-break:break-all}
.pr .about p{font-size:8.5pt}
.pr .foot2{margin-top:14px;font-size:8.5pt;color:#5A6685;border-top:1px solid #D0D8E2;padding-top:6px}
.pr .avoid{break-inside:avoid}

/* ===== v1.2 pillars: one integrated model, no ranking ===== */
.pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pill{cursor:default;min-height:0;background:var(--surf);border:1px solid var(--card-border);padding:18px 18px 16px;gap:6px}
.pill:hover{transform:none;border-color:var(--card-border)}
.pill.linked{border-color:var(--accent)}
.pill .nm{margin-top:0;font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.pill .q{font-size:17px}
.pill .note{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--t2);margin-top:6px;line-height:1.4}
.pill .dots{display:inline-flex;gap:4px;flex:none}
.pill .dots i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.hot .nomore{border-top:1px solid var(--border)}

/* ===== v1.3 ===== */
.pill{gap:4px}
.pill .kk{margin-top:10px}

document.addEventListener("keydown", e => {
  const ae = document.activeElement, tag = ae ? ae.tagName : "";
  if (e.key === "Escape") { if (S.ui.modal) { act("modalCancel", {}); return; } if (S.ui.settings) { act("closeSettings", {}); return; } }
  if (ae && ae.id === "nameIn" && e.key === "Enter") { e.preventDefault(); act("start", {}); return; }
  if (ae && ae.classList && ae.classList.contains("stop")) {
    const q = ae.dataset.q, cur = Number(ae.dataset.v);
    let n = null;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") n = Math.min(5, (typeof S.a[q] === "number" ? S.a[q] : cur) + 1);
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") n = Math.max(1, (typeof S.a[q] === "number" ? S.a[q] : cur) - 1);
    if (e.key === "Home") n = 1; if (e.key === "End") n = 5;
    if (n != null) { e.preventDefault(); act("tpick", { q, v: String(n) }); return; }
  }
  if (S.ui.modal || S.ui.settings) return;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    const n = Number(e.key);
    if (S.screen === "tensions") {
      const key = tensionList(S.a)[S.ti];
      if (key === "C1") { const ids = optIds("C1"); if (n <= ids.length) act("pick", { q: "C1", v: ids[n - 1] }); }

    const b = document.querySelector("[data-primary]:not([disabled])"); if (b) { e.preventDefault(); b.click(); }
  }
});

/* ====== SELF-TEST (for QA; run PCN.selfTest() in the console) ====== */
function selfTest() {
  const out = { ok: true, errors: [] };
  const fail = m => { out.ok = false; out.errors.push(m); };
  const ref = Object.assign(emptyAnswers(), JSON.parse(JSON.stringify(REF_SCENARIO)));
  const r = evaluate(ref);
  const expP = { H1: 6, H2: 3, H3: 5, H4: 1, H5: 2, H6: 0, H7: 1, H8: 2, H9: 0, H10: 0, H11: 0 };
  for (const h in expP) if (r.P[h] !== expP[h]) fail(`ref points ${h}: ${r.P[h]} != ${expP[h]}`);
  if (r.shown.map(s => s.id).join() !== "H1,H3,H2" || r.shown.some(s => s.fb)) fail("ref shown " + JSON.stringify(r.shown));
  if (r.also.join() !== "H5,H8") fail("ref also " + r.also);
  const expPil = { P1: "hi", P2: "hi", P3: "lo", P4: "md", P5: "md", P6: "lo", P7: "hi" };
  for (const p in expPil) if (r.pil[p] !== expPil[p]) fail(`ref pillar ${p}: ${r.pil[p]}`);
  if (r.unclear.join() !== "T4") fail("ref unclear " + r.unclear);
  if (r.grp !== "design") fail("ref group " + r.grp);
  if (!isComplete(ref)) fail("ref incomplete");
  // fallback case
  const fb = Object.assign(emptyAnswers(), { Q1: ["other"], Q2: "running", Q3: "cs", Q4: "cs", Q5: "cs", Q6: "cs", Q7: ["it"], T1: "cs", T2: "cs", T3: "cs", T4: "cs", T5: "cs", T6: "cs", T7: "cs", TM: "cs" });
  const rf = evaluate(fb);
  if (rf.shown.map(s => s.id + (s.fb ? "*" : "")).join() !== "H2*,H1*,H4*") fail("fallback " + JSON.stringify(rf.shown));
  // random + codec
  const names = ["", "Alex", "Jo <script>alert(1)<\/script>", "Zoë Müller-Łukasz", "李雷"];
  for (let i = 0; i < 500; i++) {
    const a = randomAnswers(); if (!isComplete(a)) { fail("random incomplete " + JSON.stringify(a)); break; }
    const e1 = evaluate(a); if (e1.shown.length !== 3) { fail("shown != 3"); break; }
    const nmx = names[i % names.length], demo = i % 2 === 0;
    const code = encode(a, demo, nmx), dec = decode(code);
    if (!dec) { fail("decode null " + code); break; }
    if (JSON.stringify(dec.a) !== JSON.stringify(Object.assign(emptyAnswers(), a, { Q1: Q1IDS.filter(x => a.Q1.includes(x)), Q7: Q7IDS.filter(x => a.Q7.includes(x)) }))) { fail("roundtrip mismatch " + code); break; }
    if (dec.demo !== demo || dec.name !== cleanName(nmx)) { fail("roundtrip meta " + code); break; }
    if (JSON.stringify(evaluate(dec.a).shown) !== JSON.stringify(e1.shown)) { fail("roundtrip result"); break; }
    const pos = CODE_PREFIX.length + 1 + (i % 20), ch = code[pos], alt = ch === "A" ? "B" : "A";
    const bad = code.slice(0, pos) + alt + code.slice(pos + 1);
    if (decode(bad)) out.collisions = (out.collisions || 0) + 1;
    if (code.length > 120 && !nmx) fail("code too long " + code.length);
  }
  { const keep = S.a, keepL = S.lang, bad = [];
    const walk = v => { if (Array.isArray(v) && v.length === 2 && typeof v[0] === "string") { const s = tx(v); if (/\{g|\{G|null|undefined/.test(s)) bad.push(s); } else if (v && typeof v === "object") Object.values(v).forEach(walk); };
    for (const g of GROUP_ORDER) for (const lg of ["en", "de"]) { S.a = Object.assign(emptyAnswers(), { Q7: [g] }); S.lang = lg; [TENSIONS, HOTSPOTS, SIGNALS, NEEDS, NEED_BASE, PHASE_Q, UNCLEAR].forEach(walk); }
    S.a = Object.assign(emptyAnswers(), { Q7: ["prod", "qual"] }); S.lang = "en"; if (tx(TENSIONS.T4.h) !== "What do production teams expect?") bad.push("prod T4: " + tx(TENSIONS.T4.h));
    S.lang = "de"; if (tx(HOTSPOTS.H4.t) !== "Die Produktion erwartet mehr Arbeit") bad.push("prod H4 de: " + tx(HOTSPOTS.H4.t));
    S.a = Object.assign(emptyAnswers(), { Q7: ["it", "design"] }); S.lang = "en"; if (tx(TENSIONS.T4.h) !== "What do engineers expect?") bad.push("design wins: " + tx(TENSIONS.T4.h));
    S.a = keep; S.lang = keepL; if (bad.length) fail("group wording " + bad.slice(0, 3).join(" | ")); }
  out.refCode = encode(ref, true, "Demo");
  return out;
}
window.PCN = { buildXlsx, evaluate, encode, decode, randomAnswers, isComplete, selfTest, REF_SCENARIO, mailContent: () => mailContent(), mailtoUrl: () => mailtoUrl(), state: () => S };
